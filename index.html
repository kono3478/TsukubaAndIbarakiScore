<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ランダム早押し 総合タイムアタック</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            'shake': 'shake 0.3s cubic-bezier(.36,.07,.19,.97) both',
            'fade-in-up': 'fadeInUp 0.5s ease-out'
          },
          keyframes: {
            shake: {
              '10%, 90%': { transform: 'translate3d(-2px, 0, 0)' },
              '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
              '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
              '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
            },
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            }
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ===== Google Sheets スコア送信URL =====
    const APPS_SCRIPT_URL = 'YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';

    // --- ゲーム設定 ---
    const WORDS_COUNT = 10;
    const PENALTY_MS = 1000; 
    const RADIUS = 35; 
    const SAFE_MARGIN = 55; 
    const TOTAL_ROUNDS = 15;

    // 探す対象とダミーのペア
    const GAME_PAIRS = [
      { target: '筑波', dummy: '茨城' },
      { target: '茨城', dummy: '筑波' }
    ];

    // 音声ファイルの設定 (GitHubのraw URLに変換して使用)
    const okSound = new Audio('https://raw.githubusercontent.com/kono3478/sozai/main/OK.mp3');
    const noSound = new Audio('https://raw.githubusercontent.com/kono3478/sozai/main/NO.mp3');
    const bgmSound = new Audio('https://raw.githubusercontent.com/kono3478/BGM/main/ThinkingTime.mp3');
    bgmSound.loop = true; // BGMをループ再生に設定

    function App() {
      // 初期状態でランダムにゲーム内容を決定
      const getRandomPair = () => GAME_PAIRS[Math.floor(Math.random() * GAME_PAIRS.length)];
      const [currentPair, setCurrentPair] = useState(getRandomPair());

      const [gameState, setGameState] = useState('start'); 
      const [currentRound, setCurrentRound] = useState(0); 
      const [time, setTime] = useState(0);
      const [errorId, setErrorId] = useState(null);
      const [successId, setSuccessId] = useState(null); // 正解時のIDを保持するステートを追加
      
      // ハイスコアは両方のゲームで個別に管理
      const [highScores, setHighScores] = useState({ '筑波': null, '茨城': null });
      const [isNewRecord, setIsNewRecord] = useState(false);
      const [playerName, setPlayerName] = useState('');
      const [submitStatus, setSubmitStatus] = useState('idle'); // idle | sending | done | error

      const containerRef = useRef(null);
      const gameStateRef = useRef('start'); 
      const modeRef = useRef('grid'); 
      const wordsRef = useRef([]); 
      const animationRef = useRef(null);
      const startTimeRef = useRef(0);
      const penaltyRef = useRef(0);

      // ローカルストレージからハイスコアを読み込む
      useEffect(() => {
        const tsukubaScore = localStorage.getItem('highscore-筑波');
        const ibarakiScore = localStorage.getItem('highscore-茨城');
        setHighScores({
          '筑波': tsukubaScore ? parseFloat(tsukubaScore) : null,
          '茨城': ibarakiScore ? parseFloat(ibarakiScore) : null,
        });
        return () => {
          cancelAnimationFrame(animationRef.current);
          bgmSound.pause(); // アンマウント時にBGMを停止
        };
      }, []);

      const setGameStateWithRef = (newState) => {
        setGameState(newState);
        gameStateRef.current = newState;
      };

      // 単語リストの生成
      const generateWords = (mode, width, height, headerHeight, targetWord, dummyWord) => {
        const newWords = [];
        const texts = Array(WORDS_COUNT - 1).fill(dummyWord).concat([targetWord]);
        
        // シャッフル
        for (let i = texts.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [texts[i], texts[j]] = [texts[j], texts[i]];
        }

        if (mode === 'grid') {
          return texts.map((text, i) => ({ text, id: i }));
        }

        const minDistance = RADIUS * 2 + 5; 
        for (let i = 0; i < WORDS_COUNT; i++) {
          let x, y;
          let isValid = false;
          let attempts = 0;

          while (!isValid && attempts < 500) {
            x = SAFE_MARGIN + Math.random() * (width - SAFE_MARGIN * 2);
            y = headerHeight + SAFE_MARGIN + Math.random() * (height - headerHeight - SAFE_MARGIN * 2);
            isValid = true;

            for (const existingWord of newWords) {
              const dx = existingWord.x - x;
              const dy = existingWord.y - y;
              if (Math.sqrt(dx * dx + dy * dy) < minDistance) {
                isValid = false;
                break;
              }
            }
            attempts++;
          }
          
          const rotate = Math.floor(Math.random() * 360); 
          let vx = 0, vy = 0, vr = 0;
          
          if (mode === 'moving') {
            const speed = 0.8 + Math.random() * 1.5; 
            const angle = Math.random() * Math.PI * 2;
            vx = Math.cos(angle) * speed;
            vy = Math.sin(angle) * speed;
            vr = (Math.random() - 0.5) * 1.0; 
          }
          
          newWords.push({ text: texts[i], id: i, x, y, rotate, vx, vy, vr });
        }
        return newWords;
      };

      // 毎フレームごとの更新処理
      const updateFrame = () => {
        if (gameStateRef.current !== 'playing') return;
        if (!containerRef.current) return;

        const width = containerRef.current.clientWidth;
        const height = containerRef.current.clientHeight;
        const headerHeight = Math.max(height * 0.15, 80);

        setTime(Date.now() - startTimeRef.current + penaltyRef.current);

        if (modeRef.current === 'moving') {
          const words = wordsRef.current;

          for (let i = 0; i < words.length; i++) {
            const w = words[i];
            w.x += w.vx;
            w.y += w.vy;
            w.rotate += w.vr;

            if (w.x < SAFE_MARGIN) { w.x = SAFE_MARGIN; w.vx *= -1; }
            else if (w.x > width - SAFE_MARGIN) { w.x = width - SAFE_MARGIN; w.vx *= -1; }
            
            if (w.y < headerHeight + SAFE_MARGIN) { w.y = headerHeight + SAFE_MARGIN; w.vy *= -1; }
            else if (w.y > height - SAFE_MARGIN) { w.y = height - SAFE_MARGIN; w.vy *= -1; }
          }

          for (let i = 0; i < words.length; i++) {
            for (let j = i + 1; j < words.length; j++) {
              const w1 = words[i];
              const w2 = words[j];
              const dx = w2.x - w1.x;
              const dy = w2.y - w1.y;
              const distance = Math.sqrt(dx * dx + dy * dy);
              const minDist = RADIUS * 2;

              if (distance < minDist && distance > 0) {
                const overlap = minDist - distance;
                const nx = dx / distance; 
                const ny = dy / distance; 
                
                w1.x -= nx * overlap / 2;
                w1.y -= ny * overlap / 2;
                w2.x += nx * overlap / 2;
                w2.y += ny * overlap / 2;
                
                const dvx = w1.vx - w2.vx;
                const dvy = w1.vy - w2.vy;
                const dotProduct = dvx * nx + dvy * ny;
                
                if (dotProduct > 0) continue; 
                
                w1.vx -= dotProduct * nx;
                w1.vy -= dotProduct * ny;
                w2.vx += dotProduct * nx;
                w2.vy += dotProduct * ny;
              }
            }
          }
        }

        animationRef.current = requestAnimationFrame(updateFrame);
      };

      // ゲーム開始
      const startGame = () => {
        if (!containerRef.current) return;
        const width = containerRef.current.clientWidth;
        const height = containerRef.current.clientHeight;
        const headerHeight = Math.max(height * 0.15, 80);

        modeRef.current = 'grid';
        wordsRef.current = generateWords('grid', width, height, headerHeight, currentPair.target, currentPair.dummy);
        
        setGameStateWithRef('playing');
        setCurrentRound(0);
        setTime(0);
        setErrorId(null);
        setSuccessId(null); // 初期化
        setIsNewRecord(false);
        setPlayerName('');
        setSubmitStatus('idle');
        penaltyRef.current = 0;
        startTimeRef.current = Date.now();

        // BGMを再生
        bgmSound.currentTime = 0;
        bgmSound.play().catch(e => console.log('Audio play failed:', e));

        if (animationRef.current) cancelAnimationFrame(animationRef.current);
        animationRef.current = requestAnimationFrame(updateFrame);
      };

      // ラウンド進行
      const advanceRound = () => {
        const nextRound = currentRound + 1;
        
        if (nextRound >= TOTAL_ROUNDS) {
          // 15ラウンド完了：クリア
          bgmSound.pause(); // BGM停止
          
          const finalTimeMs = Date.now() - startTimeRef.current + penaltyRef.current;
          setTime(finalTimeMs);
          setGameStateWithRef('result');
          cancelAnimationFrame(animationRef.current);
          
          // ハイスコア判定
          const finalTimeSec = finalTimeMs / 1000;
          const currentHighScore = highScores[currentPair.target];

          if (currentHighScore === null || finalTimeSec < currentHighScore) {
            setHighScores(prev => ({ ...prev, [currentPair.target]: finalTimeSec }));
            setIsNewRecord(true);
            localStorage.setItem(`highscore-${currentPair.target}`, finalTimeSec.toString());
          }
        } else {
          setCurrentRound(nextRound);
          
          let nextMode = 'grid';
          if (nextRound >= 5 && nextRound < 10) nextMode = 'random';
          else if (nextRound >= 10) nextMode = 'moving';
          
          modeRef.current = nextMode;

          const width = containerRef.current.clientWidth;
          const height = containerRef.current.clientHeight;
          const headerHeight = Math.max(height * 0.15, 80);

          wordsRef.current = generateWords(nextMode, width, height, headerHeight, currentPair.target, currentPair.dummy);
          setErrorId(null);
        }
      };

      // 単語タップ時の処理
      const handleWordClick = (word) => {
        if (gameStateRef.current !== 'playing') return;
        if (successId !== null) return; // 正解演出中は他のタップを無効化

        if (word.text === currentPair.target) {
          // 正解音を再生
          okSound.currentTime = 0;
          okSound.play().catch(e => console.log('Audio play failed:', e));

          // 正解の時は緑色にするためのステートをセットし、0.3秒後に次へ進む
          setSuccessId(word.id);
          setTimeout(() => {
            setSuccessId(null);
            advanceRound();
          }, 300);
        } else {
          // 不正解音を再生
          noSound.currentTime = 0;
          noSound.play().catch(e => console.log('Audio play failed:', e));

          penaltyRef.current += PENALTY_MS;
          setErrorId(word.id);
          setTime(Date.now() - startTimeRef.current + penaltyRef.current);
          setTimeout(() => setErrorId(null), 300);
        }
      };

      // スコア送信
      const submitScore = async () => {
        const name = playerName.trim();
        if (!name) return;
        setSubmitStatus('sending');

        const finalTimeSec = (time / 1000).toFixed(2);
        const penaltySec = (penaltyRef.current / 1000).toFixed(2);
        const params = new URLSearchParams();
        params.append('playerName', name);
        params.append('mode', currentPair.target + 'モード');
        params.append('totalTime', finalTimeSec);
        params.append('penalty', penaltySec);
        params.append('isNewRecord', isNewRecord ? 'YES' : 'NO');
        params.append('submittedAt', new Date().toISOString());

        try {
          await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: params });
          setSubmitStatus('done');
          setTimeout(() => returnToTitle(), 1500);
        } catch (e) {
          setSubmitStatus('error');
          setTimeout(() => setSubmitStatus('idle'), 2000);
        }
      };

      // タイトルへ戻る処理（新しいゲームをランダム抽選）
      const returnToTitle = () => {
        setCurrentPair(getRandomPair());
        setGameStateWithRef('start');
      };

      const formatTime = (ms) => {
        return (ms / 1000).toFixed(2);
      };

      const getStageInfo = () => {
        if (currentRound < 5) return { label: '整列', stage: 1, current: currentRound + 1 };
        if (currentRound < 10) return { label: 'ランダム', stage: 2, current: currentRound - 4 };
        return { label: '動く', stage: 3, current: currentRound - 9 };
      };

      const activeHighScore = highScores[currentPair.target];

      return (
        <div 
          ref={containerRef}
          className="relative w-full h-screen bg-slate-100 overflow-hidden font-serif flex flex-col"
        >
          {/* --- ヘッダー領域 --- */}
          {gameState === 'playing' && (
            <div className="absolute top-0 left-0 w-full h-[15%] min-h-[80px] p-4 flex justify-between items-center z-20 bg-white/70 backdrop-blur-md border-b border-slate-200 shadow-sm pointer-events-none">
              <div className="flex flex-col">
                <h1 className="text-xl font-bold text-slate-700 tracking-widest font-sans">{currentPair.target}を探せ</h1>
                <div className="flex items-center space-x-2 mt-1">
                  <span className={`px-2 py-0.5 rounded text-xs font-bold text-white font-sans ${
                    modeRef.current === 'grid' ? 'bg-blue-500' :
                    modeRef.current === 'random' ? 'bg-purple-500' : 'bg-rose-500'
                  }`}>
                    STAGE {getStageInfo().stage}: {getStageInfo().label}
                  </span>
                  <span className="text-sm font-bold text-slate-500 font-sans">
                    {getStageInfo().current} / 5
                  </span>
                </div>
              </div>
              <div className="text-3xl font-mono font-bold text-slate-800">
                {formatTime(time)}<span className="text-base ml-1">秒</span>
              </div>
            </div>
          )}

          {/* --- プレイ画面 --- */}
          {gameState === 'playing' && (
            <div className="flex-grow relative w-full h-full z-10 pt-[15%]">
              {modeRef.current === 'grid' && (
                <div className="h-full flex items-center justify-center p-4">
                  <div className="grid grid-cols-2 gap-3 w-full max-w-md">
                    {wordsRef.current.map((word) => (
                      <button
                        key={word.id}
                        onClick={() => handleWordClick(word)}
                        className={`
                          p-6 rounded-xl text-3xl md:text-4xl font-black shadow-sm border-2 
                          transition-transform active:scale-95 flex items-center justify-center
                          ${errorId === word.id 
                            ? 'bg-red-500 border-red-600 text-white animate-shake' 
                            : successId === word.id
                              ? 'bg-green-500 border-green-600 text-white scale-105'
                              : 'bg-white border-slate-200 text-slate-800'}
                        `}
                      >
                        {word.text}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {(modeRef.current === 'random' || modeRef.current === 'moving') && wordsRef.current.map((word) => (
                <button
                  key={word.id}
                  onClick={() => handleWordClick(word)}
                  className={`
                    absolute flex items-center justify-center text-4xl md:text-5xl font-black cursor-pointer select-none transition-transform duration-150
                    ${errorId === word.id 
                      ? 'text-red-600 scale-110' 
                      : successId === word.id
                        ? 'text-green-500 scale-110'
                        : 'text-slate-800 hover:scale-105'}
                  `}
                  style={{
                    left: `${word.x - RADIUS}px`,
                    top: `${word.y - RADIUS}px`,
                    width: `${RADIUS * 2}px`,
                    height: `${RADIUS * 2}px`,
                    transform: `rotate(${word.rotate}deg)`,
                    WebkitTapHighlightColor: 'transparent'
                  }}
                >
                  {word.text}
                </button>
              ))}
            </div>
          )}

          {/* --- スタート・結果 モーダル --- */}
          {gameState !== 'playing' && (
            <div className="absolute inset-0 z-30 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
              <div className="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full text-center">
                
                <h1 className="text-3xl font-black mb-2 text-indigo-900 tracking-widest font-sans">
                  {currentPair.target}を探せ！
                </h1>
                <p className="text-indigo-600 font-bold mb-6 tracking-wide">総合タイムアタック</p>

                {gameState === 'start' ? (
                  <div className="space-y-6 font-sans">
                    <div className="text-slate-600 text-left bg-slate-50 p-4 rounded-xl text-sm space-y-2 border border-slate-100">
                      <p className="font-bold flex justify-between"><span>STAGE 1: 整列</span><span>5回</span></p>
                      <p className="font-bold flex justify-between text-purple-700"><span>STAGE 2: ランダム配置</span><span>5回</span></p>
                      <p className="font-bold flex justify-between text-rose-600"><span>STAGE 3: フワフワ動く</span><span>5回</span></p>
                      <hr className="my-2" />
                      <p className="text-center font-black text-slate-800 pt-1">全15回の合計タイムを競え！</p>
                      <p className="text-center text-xs text-slate-500 mt-1">※9個の「{currentPair.dummy}」から1つの「{currentPair.target}」を探します</p>
                    </div>

                    {activeHighScore !== null && (
                      <div className="flex flex-col items-center justify-center p-3 bg-yellow-50 rounded-lg text-yellow-800 border border-yellow-200">
                        <span className="text-xs font-bold mb-1">現在の自己ベスト ({currentPair.target})</span>
                        <span className="text-2xl font-black font-mono">{activeHighScore.toFixed(2)}<span className="text-sm ml-1">秒</span></span>
                      </div>
                    )}

                    <button
                      onClick={startGame}
                      className="mt-4 px-10 py-4 bg-indigo-600 text-white rounded-full font-bold text-xl shadow-lg hover:bg-indigo-700 active:scale-95 transition-transform w-full"
                    >
                      ゲームスタート
                    </button>
                  </div>
                ) : (
                  <div className="space-y-5 font-sans animate-fade-in-up">
                    
                    {isNewRecord && (
                      <div className="inline-block px-4 py-1 bg-red-500 text-white rounded-full font-bold text-sm mb-2 animate-bounce">
                        🎉 NEW RECORD! 🎉
                      </div>
                    )}
                    <div className="text-3xl font-black text-emerald-500 tracking-wider">
                      全ステージクリア！
                    </div>
                    
                    <div className="bg-slate-50 rounded-2xl p-6 border-2 border-slate-100">
                      <p className="text-slate-500 mb-2 font-bold">合計クリアタイム</p>
                      <p className={`text-5xl font-mono font-black mb-2 ${isNewRecord ? 'text-red-500' : 'text-indigo-900'}`}>
                        {formatTime(time)}<span className="text-2xl ml-1 text-slate-500">秒</span>
                      </p>
                      {penaltyRef.current > 0 && (
                        <p className="text-sm text-red-500 font-bold">
                          (お手つきペナルティ: +{formatTime(penaltyRef.current)}秒)
                        </p>
                      )}
                    </div>

                    {/* ネームエントリー */}
                    <div className="bg-indigo-50 rounded-2xl p-4 border border-indigo-100">
                      <p className="text-xs font-bold text-indigo-400 mb-2 tracking-widest uppercase">Name Entry</p>
                      <input
                        type="text"
                        maxLength={12}
                        placeholder="PLAYER NAME"
                        value={playerName}
                        onChange={e => setPlayerName(e.target.value.replace(/[^A-Za-z0-9]/g, ''))}
                        className="w-full text-center text-2xl font-bold py-3 px-4 rounded-xl border-2 border-indigo-200 focus:border-indigo-500 outline-none bg-white text-slate-800 tracking-widest"
                        style={{ fontFamily: 'monospace' }}
                      />
                    </div>

                    {/* 送信ボタン */}
                    <button
                      onClick={submitScore}
                      disabled={!playerName.trim() || submitStatus === 'sending' || submitStatus === 'done'}
                      className={`w-full py-4 rounded-full font-bold text-lg shadow-lg transition-all active:scale-95
                        ${submitStatus === 'done' ? 'bg-green-500 text-white' :
                          submitStatus === 'error' ? 'bg-red-500 text-white' :
                          submitStatus === 'sending' ? 'bg-indigo-300 text-white cursor-wait' :
                          !playerName.trim() ? 'bg-slate-200 text-slate-400 cursor-not-allowed' :
                          'bg-indigo-600 text-white hover:bg-indigo-700'}`}
                    >
                      {submitStatus === 'done' ? '✓ 送信完了！' :
                       submitStatus === 'error' ? '⚠ 送信失敗（再試行）' :
                       submitStatus === 'sending' ? '送信中...' : 'スコア送信'}
                    </button>

                    <button
                      onClick={returnToTitle}
                      className="w-full py-4 bg-slate-100 text-slate-500 rounded-full font-bold text-lg hover:bg-slate-200 active:scale-95 transition-all border border-slate-200"
                    >
                      次のゲームへ（ランダム）
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
